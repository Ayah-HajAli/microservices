name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - development
          - staging
          - production
        default: development

      version:
        description: Docker image version
        required: true
        default: latest

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build auth service
        uses: docker/build-push-action@v6
        with:
          context: ./services/auth-service
          push: false
          tags: ecommerce-auth-service:${{ inputs.version }}

      - name: Build product service
        uses: docker/build-push-action@v6
        with:
          context: ./services/product-service
          push: false
          tags: ecommerce-product-service:${{ inputs.version }}

      - name: Build order service
        uses: docker/build-push-action@v6
        with:
          context: ./services/order-service
          push: false
          tags: ecommerce-order-service:${{ inputs.version }}

      - name: Build notification service
        uses: docker/build-push-action@v6
        with:
          context: ./services/notification-service
          push: false
          tags: ecommerce-notification-service:${{ inputs.version }}

      - name: Build frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: ecommerce-frontend:${{ inputs.version }}

      - name: Build nginx
        uses: docker/build-push-action@v6
        with:
          context: ./nginx
          push: false
          tags: ecommerce-nginx:${{ inputs.version }}

      - name: Validate Docker Compose
        run: docker compose config

      - name: Deployment summary
        run: |
          echo "=================================="
          echo "Deployment completed"
          echo "Environment: ${{ inputs.environment }}"
          echo "Version:     ${{ inputs.version }}"
          echo "=================================="