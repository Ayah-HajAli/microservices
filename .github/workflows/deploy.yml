      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 20m
          script: |
            echo "======================================"
            echo "Starting deployment"
            echo "Environment: ${{ inputs.environment }}"
            echo "Version:     ${{ inputs.version }}"
            echo "======================================"

            REPO_DIR=$(find "$HOME" -maxdepth 3 -type f -name "docker-compose.yml" -exec dirname {} \; | head -n 1)

            if [ -z "$REPO_DIR" ]; then
              echo "ERROR: Could not find docker-compose.yml"
              exit 1
            fi

            echo "Repository found at: $REPO_DIR"

            cd "$REPO_DIR" || exit 1

            echo "Pulling latest code..."
            git fetch origin
            git reset --hard origin/main

            echo "Building and starting application..."
            docker compose up -d --build

            echo "Waiting for services..."
            sleep 15

            echo "Container status:"
            docker compose ps

            echo "Testing product API..."
            curl --fail http://localhost:8080/api/products/products

            echo ""
            echo "======================================"
            echo "DEPLOYMENT SUCCESSFUL"
            echo "======================================"